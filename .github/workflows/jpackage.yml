name: jpackage
on:
  push:
    branches:
      - master

jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: 22
          architecture: x64

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Make Gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Build project
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            ./gradlew.bat --console verbose -S clean shadowJar
          else
            ./gradlew --console verbose -S clean shadowJar
          fi

      - name: Get version
        shell: bash
        run: |
          echo "ver=$(./gradlew -q ver)" >> "$GITHUB_ENV"
          echo ${{ env.ver }}

      - name: Build macOS dmg
        if: runner.os == 'macOS'
        run: |
          jpackage \
              --input build/libs \
              --main-jar PoisonCogfly-${{ env.ver }}.jar \
              --main-class dev.ambershadow.cogfly.Cogfly \
              --name "PoisonCogfly" \
              --type dmg \
              --vendor "Timothy Marriott" \
              --icon ./resources/icons/icon.icns \
              --app-version ${{ env.ver }} \
              --dest output/${{ runner.os }} \
              --resource-dir resources/mac \
              --verbose

      - name: Build Windows EXE
        if: runner.os == 'Windows'
        run: |
          jpackage `
            --input build/libs `
            --main-jar PoisonCogfly-${{ env.ver }}.jar `
            --main-class dev.ambershadow.cogfly.Cogfly `
            --name PoisonCogfly `
            --type app-image `
            --vendor "Timothy Marriott" `
            --icon ./resources/icons/icon.ico `
            --app-version ${{ env.ver }} `
            --dest output/${{ runner.os }} `
            --verbose
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/Dcgver=${{ env.ver }}" Cogfly.iss
          Remove-Item -Recurse -Force "output\Windows"
          New-Item -ItemType Directory -Force -Path "output\Windows"
          Copy-Item -Recurse -Force "Output\PoisonCogfly-${{ env.ver }}-installer.exe" "output\Windows\"

      - name: Build DEB
        if: runner.os == 'Linux'
        run: |
          jpackage \
            --input build/libs \
            --main-jar PoisonCogfly-${{ env.ver }}.jar \
            --main-class dev.ambershadow.cogfly.Cogfly \
            --name PoisonCogfly \
            --type deb \
            --vendor "Timothy Marriott" \
            --icon ./resources/icons/icon.png \
            --app-version ${{ env.ver }} \
            --dest output/${{ runner.os }} \
            --resource-dir resources/linux \
            --verbose \
            --linux-shortcut

      - name: Build RPM
        if: runner.os == 'Linux'
        run: |
          jpackage \
            --input build/libs \
            --main-jar PoisonCogfly-${{ env.ver }}.jar \
            --main-class dev.ambershadow.cogfly.Cogfly \
            --name PoisonCogfly \
            --type rpm \
            --vendor "Timothy Marriott" \
            --icon ./resources/icons/icon.png \
            --app-version ${{ env.ver }} \
            --dest output/${{ runner.os }} \
            --resource-dir resources/linux \
            --verbose \
            --linux-shortcut

      - name: Build APPIMAGE
        if: runner.os == 'Linux'
        run: |
          mkdir -p output/appimage
          mkdir -p output/${{ runner.os }}
          jpackage \
            --input build/libs \
            --main-jar PoisonCogfly-${{ env.ver }}.jar \
            --main-class dev.ambershadow.cogfly.Cogfly \
            --name PoisonCogfly \
            --type app-image \
            --vendor "Timothy Marriott" \
            --icon ./resources/icons/icon.png \
            --app-version ${{ env.ver }} \
            --dest output/appimage \
            --verbose 
          cp ./resources/icons/icon.png output/appimage/PoisonCogfly/
          cp ./resources/linux/PoisonCogfly_appimage.desktop output/appimage/PoisonCogfly/PoisonCogfly.desktop
          cat > output/appimage/PoisonCogfly/AppRun << 'EOF'
          #!/bin/sh
          export _JAVA_AWT_WM_NONREPARENTING=1
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/bin/PoisonCogfly" "$@"
          EOF
          chmod +x output/appimage/PoisonCogfly/AppRun
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ls -l output/appimage/PoisonCogfly
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./appimagetool \
            -u "gh-releases-zsync|${{ github.repository_owner }}|PoisonCogfly|latest|PoisonCogfly-*.AppImage" \
            output/appimage/PoisonCogfly output/${{ runner.os }}/PoisonCogfly-${{ env.ver }}.AppImage
          mv ./PoisonCogfly-${{ env.ver }}.AppImage.zsync output/${{ runner.os }}/ 2>/dev/null || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PoisonCogfly-${{ runner.os }}
          path: output/${{ runner.os }}
          retention-days: 14
